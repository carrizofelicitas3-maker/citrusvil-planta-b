<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citrusvil | Planta B</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .block-ring {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
        }
        .camara-node {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Disposición en Cruz Perfecta para 4 Cámaras por Reloj (12, 3, 6, 9 en punto) */
        .pos-0 { top: 15%; left: 50%; }
        .pos-1 { top: 50%; left: 85%; }
        .pos-2 { top: 85%; left: 50%; }
        .pos-3 { top: 50%; left: 15%; }

        @keyframes spin-clockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-clockwise {
            animation: spin-clockwise 25s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased">

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        
        <header class="border-b border-slate-200 pb-5 mb-6">
            <div class="flex items-baseline gap-3">
                <span class="text-2xl md:text-3xl font-black text-emerald-700 tracking-wider">CITRUSVIL</span>
                <span class="text-lg md:text-xl font-bold text-slate-400 tracking-wide">| PLANTA B</span>
            </div>
            <h1 class="text-xl md:text-2xl font-extrabold text-slate-900 mt-2 tracking-tight">
                Dinámica de almacenamiento en cámaras de frío
            </h1>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center mb-6">
            <div class="md:col-span-4 bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
                            Secuencia por Pasos
                        </h2>
                        <span id="contador-pasos" class="text-xs font-bold text-slate-600 mt-0.5 block">Paso 1</span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="retrocederPaso()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-xs font-bold transition cursor-pointer border border-slate-200/60">◀</button>
                        <button onclick="avanzarPaso()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition shadow-md shadow-indigo-600/10 cursor-pointer">Avanzar ▶</button>
                        <button onclick="reiniciarSimulacion()" class="bg-slate-50 hover:bg-slate-100 text-slate-400 px-2.5 py-2 rounded-lg text-xs border border-slate-200/40 cursor-pointer">⟳</button>
                    </div>
                </div>
            </div>

            <div class="md:col-span-8 bg-slate-100 border border-slate-200 p-4 rounded-xl flex items-center relative overflow-hidden h-[74px]">
                <div class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-600"></div>
                <p class="text-xs md:text-sm font-medium text-slate-600 leading-relaxed pl-2" id="datos-operacion">
                    </p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-col items-center">
                <div class="text-center mb-4">
                    <span class="text-[10px] font-black bg-blue-100 text-blue-700 px-2.5 py-0.5 rounded-full border border-blue-200 uppercase tracking-wider">Block 1</span>
                    <h3 class="text-sm font-bold text-slate-800 mt-1">NFC y Pulpa</h3>
                </div>
                
                <div class="block-ring bg-slate-50 border border-slate-100 flex items-center justify-center shadow-inner my-2">
                    <div class="w-16 h-16 rounded-full bg-white border border-slate-200 flex items-center justify-center z-10 shadow-sm">
                        <svg class="w-4 h-4 text-blue-500 animate-spin-clockwise" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" />
                        </svg>
                    </div>
                    <div id="ring-b1" class="absolute inset-0 w-full h-full"></div>
                </div>
            </div>

            <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-col items-center">
                <div class="text-center mb-4">
                    <span class="text-[10px] font-black bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full border border-indigo-200 uppercase tracking-wider">Block 2</span>
                    <h3 class="text-sm font-bold text-slate-800 mt-1">Jugo Turbio / Claro (I)</h3>
                </div>
                
                <div class="block-ring bg-slate-50 border border-slate-100 flex items-center justify-center shadow-inner my-2">
                    <div class="w-16 h-16 rounded-full bg-white border border-slate-200 flex items-center justify-center z-10 shadow-sm">
                        <svg class="w-4 h-4 text-orange-500 animate-spin-clockwise" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" />
                        </svg>
                    </div>
                    <div id="ring-b2" class="absolute inset-0 w-full h-full"></div>
                </div>
            </div>

            <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-col items-center">
                <div class="text-center mb-4">
                    <span class="text-[10px] font-black bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full border border-indigo-200 uppercase tracking-wider">Block 3</span>
                    <h3 class="text-sm font-bold text-slate-800 mt-1">Jugo Turbio / Claro (II)</h3>
                </div>
                
                <div class="block-ring bg-slate-50 border border-slate-100 flex items-center justify-center shadow-inner my-2">
                    <div class="w-16 h-16 rounded-full bg-white border border-slate-200 flex items-center justify-center z-10 shadow-sm">
                        <svg class="w-4 h-4 text-orange-500 animate-spin-clockwise" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" />
                        </svg>
                    </div>
                    <div id="ring-b3" class="absolute inset-0 w-full h-full"></div>
                </div>
            </div>

        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-white border border-slate-200 p-4 rounded-xl shadow-sm text-[10px] font-bold text-slate-500 mt-6">
            <div class="flex items-center gap-1.5 bg-slate-50 p-2 rounded-lg border border-slate-200/60 justify-center">
                <div class="w-2.5 h-2.5 bg-blue-500 animate-pulse rounded"></div>
                <span>Ingreso B1 (NFC/Pulpa)</span>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-50 p-2 rounded-lg border border-slate-200/60 justify-center">
                <div class="w-2.5 h-2.5 bg-orange-500 animate-pulse rounded"></div>
                <span>Ingreso B2/B3 + Interplanta</span>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-50 p-2 rounded-lg border border-slate-200/60 justify-center">
                <div class="w-2.5 h-2.5 bg-amber-600 rounded"></div>
                <span>Sector Aceites (Bloqueada)</span>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-50 p-2 rounded-lg border border-slate-200/60 justify-center">
                <div class="w-2.5 h-2.5 bg-emerald-600 rounded"></div>
                <span>Estanco (Stock Guardado)</span>
            </div>
        </div>

    </div>

    <script>
        let pasoActual = 0;

        // Distribución física real por relojes
        const configB1 = [1, 2, 3, 4];   // C2 es Aceite fija
        const configB2 = [5, 6, 7, 8];   // Block 2
        const configB3 = [9, 10, 11, 12]; // Block 3

        const cronogramaPasos = [
            { paso: "Paso 1", b1: 1, b23: 5, obs: "Cámara 1 activa para NFC/Pulpa. Cámara 5 (Block 2) unifica el ingreso diario de la planta y la descarga de camiones de Interplanta." },
            { paso: "Paso 2", b1: 3, b23: 6, obs: "NFC rota hacia Cámara 3 (C2 queda saltada de forma permanente). El flujo de jugos e Interplanta avanza en sentido horario a Cámara 6." },
            { paso: "Paso 3", b1: 4, b23: 7, obs: "Block 1 asigna el ingreso a Cámara 4. Las líneas de jugo Turbio/Claro desplazan la recepción activa a Cámara 7." },
            { paso: "Paso 4", b1: 1, b23: 8, obs: "Block 1 reinicia ciclo en Cámara 1. Block 2 abre su última posición en Cámara 8 absorbiendo la totalidad del caudal diario." },
            { paso: "Paso 5", b1: 3, b23: 9, obs: "Ingreso de NFC en Cámara 3. El circuito de jugos salta al Block 3 abriendo Cámara 9 como pulmón receptor general." },
            { paso: "Paso 6", b1: 4, b23: 10, obs: "Block 1 opera sobre Cámara 4. El ruteo de jugos propios y la consolidación de externos avanza a Cámara 10." },
            { paso: "Paso 7", b1: 1, b23: 11, obs: "Reinicio rotativo en Cámara 1 para Block 1. Las líneas masivas de jugo Claro/Turbio se derivan hacia Cámara 11." },
            { paso: "Paso 8", b1: 3, b23: 12, obs: "Block 1 asigna Cámara 3. El circuito unificado de jugos cierra la secuencia horaria abriendo la Cámara 12." },
            { paso: "Paso 9", b1: 4, b23: 5, obs: "Sincronismo completo: Block 1 rutea a la 4 y el circuito de jugos (B2/B3) reinicia el anillo volviendo a abrir la Cámara 5." }
        ];

        function renderizarBloques() {
            const datos = cronogramaPasos[pasoActual];
            
            // Actualizar textos informativos rápidos
            document.getElementById('contador-pasos').innerText = `Visualizando: ${datos.paso}`;
            document.getElementById('datos-operacion').innerHTML = `<strong>Evolución de Planta B:</strong> ${datos.obs}`;

            // Render Anillo 1 (NFC / Pulpa)
            renderAnillo('ring-b1', configB1, datos.b1, 'b1');
            // Render Anillo 2 (Turbio / Claro I)
            renderAnillo('ring-b2', configB2, datos.b23, 'b23');
            // Render Anillo 3 (Turbio / Claro II)
            renderAnillo('ring-b3', configB3, datos.b23, 'b23');
        }

        function renderAnillo(idContenedor, camaras, camaraActiva, tipoBlock) {
            const contenedor = document.getElementById(idContenedor);
            contenedor.innerHTML = '';

            camaras.forEach((num, index) => {
                let cardEstilos = 'bg-slate-50/60 border-slate-200 text-slate-400';
                let badgeEstilos = 'bg-emerald-600 text-white font-medium';
                let textoEstado = 'ESTANCO';
                let shadowGlow = 'shadow-sm';

                if (num === 2) {
                    cardEstilos = 'bg-amber-50/40 border-amber-400 text-amber-900';
                    badgeEstilos = 'bg-amber-600 text-white font-bold';
                    textoEstado = 'ACEITE';
                } else if (tipoBlock === 'b1' && num === camaraActiva) {
                    cardEstilos = 'bg-blue-50 border-blue-400 text-blue-900 ring-1 ring-blue-200/50';
                    badgeEstilos = 'bg-blue-500 text-white font-bold animate-pulse';
                    textoEstado = 'INGRESO';
                    shadowGlow = 'shadow-md shadow-blue-500/5';
                } else if (tipoBlock === 'b23' && num === camaraActiva) {
                    cardEstilos = 'bg-orange-50 border-orange-400 text-orange-900 ring-1 ring-orange-200/50';
                    badgeEstilos = 'bg-orange-500 text-white font-black animate-pulse';
                    textoEstado = 'ING + INT';
                    shadowGlow = 'shadow-md shadow-orange-500/5';
                }

                contenedor.innerHTML += `
                    <div class="camara-node pos-${index} ${shadowGlow} w-[46px] h-[46px] border rounded-lg flex flex-col items-center justify-center p-0.5 text-center select-none ${cardEstilos}">
                        <span class="text-[12px] font-black tracking-tight leading-none">${num}</span>
                        <span class="text-[5.5px] font-extrabold tracking-wide mt-0.5 uppercase ${badgeEstilos} px-0.5 rounded-sm">${textoEstado}</span>
                    </div>
                `;
            });
        }

        function avanzarPaso() {
            if (pasoActual < cronogramaPasos.length - 1) {
                pasoActual++;
            } else {
                pasoActual = 0; 
            }
            renderizarBloques();
        }

        function retrocederPaso() {
            if (pasoActual > 0) {
                pasoActual--;
                renderizarBloques();
            }
        }

        function reiniciarSimulacion() {
            pasoActual = 0;
            renderizarBloques();
        }

        // Arranque inicial
        renderizarBloques();
    </script>
</body>
</html>
