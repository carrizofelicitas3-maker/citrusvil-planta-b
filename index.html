<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citrusvil | Planta B</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Contenedores circulares más grandes y legibles */
        .ring-large {
            position: relative;
            width: 240px;
            height: 240px;
            border-radius: 50%;
        }
        
        .camara-node {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Disposición en Cruz Perfecta (12, 3, 6, 9 en punto) */
        .pos-0 { top: 15%; left: 50%; }
        .pos-1 { top: 50%; left: 85%; }
        .pos-2 { top: 85%; left: 50%; }
        .pos-3 { top: 50%; left: 15%; }

        @keyframes spin-clockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-clockwise {
            animation: spin-clockwise 25s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased">

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        
        <header class="border-b border-slate-200 pb-5 mb-8">
            <div class="flex items-baseline gap-3">
                <span class="text-2xl md:text-3xl font-black text-emerald-700 tracking-wider">CITRUSVIL</span>
                <span class="text-lg md:text-xl font-bold text-slate-400 tracking-wide">| PLANTA B</span>
            </div>
            <h1 class="text-xl md:text-2xl font-extrabold text-slate-900 mt-2 tracking-tight">
                Dinámica de almacenamiento en cámaras de frío
            </h1>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-center mb-8">
            <div class="lg:col-span-4 bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
                            Secuencia por Pasos
                        </h2>
                        <span id="contador-pasos" class="text-xs font-bold text-slate-600 mt-0.5 block">Paso 1</span>
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick="retrocederPaso()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-xs font-bold transition cursor-pointer border border-slate-200/60">◀</button>
                        <button onclick="avanzarPaso()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-xs font-bold transition shadow-md shadow-indigo-600/10 cursor-pointer">Avanzar ▶</button>
                        <button onclick="reiniciarSimulacion()" class="bg-slate-50 hover:bg-slate-100 text-slate-400 px-2.5 py-2 rounded-lg text-xs border border-slate-200/40 cursor-pointer">⟳</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 bg-slate-100 border border-slate-200 p-4 rounded-xl flex items-center relative overflow-hidden h-[74px]">
                <div class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-600"></div>
                <p class="text-xs md:text-sm font-medium text-slate-600 leading-relaxed pl-2" id="datos-operacion">
                    </p>
            </div>
        </div>

        <div class="space-y-8">
            
            <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-col items-center max-w-md mx-auto lg:mx-0 lg:max-w-none">
                <div class="text-center mb-6">
                    <span class="text-[10px] font-black bg-blue-100 text-blue-700 px-3 py-1 rounded-full border border-blue-200 uppercase tracking-wider">Block 1</span>
                    <h3 class="text-base font-bold text-slate-800 mt-1">NFC y Pulpa</h3>
                </div>
                
                <div class="ring-large bg-slate-50 border border-slate-100 flex items-center justify-center shadow-inner my-2">
                    <div class="w-20 h-20 rounded-full bg-white border border-slate-200 flex items-center justify-center z-10 shadow-sm">
                        <svg class="w-5 h-5 text-blue-500 animate-spin-clockwise" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" />
                        </svg>
                    </div>
                    <div id="ring-b1" class="absolute inset-0 w-full h-full"></div>
                </div>
            </div>

            <div class="bg-white border border-slate-200 p-6 rounded-2xl shadow-sm flex flex-col items-center">
                <div class="text-center mb-6">
                    <span class="text-[10px] font-black bg-orange-100 text-orange-700 px-3 py-1 rounded-full border border-orange-200 uppercase tracking-wider">Circuito Unificado Continuo</span>
                    <h3 class="text-base font-bold text-slate-800 mt-1">Jugo Turbio y Claro</h3>
                </div>

                <div class="flex flex-col md:flex-row items-center justify-center gap-8 md:gap-4 relative w-full max-w-4xl py-4">
                    
                    <div class="flex flex-col items-center relative">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Block 2</span>
                        <div class="ring-large bg-slate-50 border border-slate-100 flex items-center justify-center shadow-inner">
                            <div id="ring-b2" class="absolute inset-0 w-full h-full"></div>
                        </div>
                    </div>

                    <div class="hidden md:flex text-slate-300 text-4xl font-light select-none transform scale-y-150 z-20">
                        ∞
                    </div>

                    <div class="flex flex-col items-center relative">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Block 3</span>
                        <div class="ring-large bg-slate-50 border border-slate-100 flex items-center justify-center shadow-inner">
                            <div id="ring-b3" class="absolute inset-0 w-full h-full"></div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-white border border-slate-200 p-4 rounded-xl shadow-sm text-xs font-bold text-slate-500 mt-8">
            <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200/60 justify-center">
                <div class="w-3 h-3 bg-blue-500 animate-pulse rounded"></div>
                <span>Ingreso Producción</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200/60 justify-center">
                <div class="w-3 h-3 bg-orange-500 animate-pulse rounded"></div>
                <span>Ingreso + Interplanta (🚚)</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200/60 justify-center border-l-red-200">
                <div class="w-3 h-3 bg-red-600 rounded"></div>
                <span>Aceites (Bloqueada Permanente)</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200/60 justify-center">
                <div class="w-3 h-3 bg-emerald-600 rounded"></div>
                <span>Estanco (Aislamiento Activo)</span>
            </div>
        </div>

    </div>

    <script>
        let pasoActual = 0;

        const configB1 = [1, 2, 3, 4];   
        const configB2 = [5, 6, 7, 8];   
        const configB3 = [9, 10, 11, 12]; 

        const cronogramaPasos = [
            { paso: "Paso 1", b1: 1, b23: 5, obs: "Cámara 1 activa para NFC y Pulpa. Cámara 5 (Block 2) unifica el ingreso diario de la planta y recibe camiones de Interplanta." },
            { paso: "Paso 2", b1: 3, b23: 6, obs: "NFC rota hacia Cámara 3 (Cámara 2 queda saltada). El flujo de jugo turbio y claro junto a Interplanta avanza a Cámara 6." },
            { paso: "Paso 3", b1: 4, b23: 7, obs: "Block 1 asigna el ingreso a Cámara 4. Las líneas de jugo turbio y claro desplazan la recepción activa a Cámara 7." },
            { paso: "Paso 4", b1: 1, b23: 8, obs: "Block 1 reinicia ciclo en Cámara 1. Block 2 abre su última posición en Cámara 8 absorbiendo el caudal diario." },
            { paso: "Paso 5", b1: 3, b23: 9, obs: "Ingreso de NFC en Cámara 3. El circuito infinito cruza al Block 3 abriendo la Cámara 9 como pulmón receptor general." },
            { paso: "Paso 6", b1: 4, b23: 10, obs: "Block 1 opera sobre Cámara 4. El ruteo de jugos propios y la consolidación externa avanza a Cámara 10." },
            { paso: "Paso 7", b1: 1, b23: 11, obs: "Reinicio rotativo en Cámara 1 para Block 1. Las líneas masivas de jugo turbio y claro se derivan hacia Cámara 11." },
            { paso: "Paso 8", b1: 3, b23: 12, obs: "Block 1 asigna Cámara 3. El circuito unificado de jugos cierra la secuencia en la Cámara 12 del Block 3." },
            { paso: "Paso 9", b1: 4, b23: 5, obs: "Sincronismo completo: Block 1 rutea a la 4 y el circuito infinito de jugos reinicia el ciclo volviendo a abrir la Cámara 5." }
        ];

        function renderizarBloques() {
            const datos = cronogramaPasos[pasoActual];
            
            document.getElementById('contador-pasos').innerText = `Visualizando: ${datos.paso}`;
            document.getElementById('datos-operacion').innerHTML = `<strong>Evolución de Planta B:</strong> ${datos.obs}`;

            // Render Anillo 1 (NFC / Pulpa)
            renderAnillo('ring-b1', configB1, datos.b1, 'b1');
            // Render Anillo 2 (Jugo Turbio / Claro - Block 2)
            renderAnillo('ring-b2', configB2, datos.b23, 'b23');
            // Render Anillo 3 (Jugo Turbio / Claro - Block 3)
            renderAnillo('ring-b3', configB3, datos.b23, 'b23');
        }

        function renderAnillo(idContenedor, camaras, camaraActiva, tipoBlock) {
            const contenedor = document.getElementById(idContenedor);
            contenedor.innerHTML = '';

            camaras.forEach((num, index) => {
                let cardEstilos = 'bg-slate-50 border-slate-200 text-slate-400';
                let badgeEstilos = 'bg-emerald-600 text-white';
                let textoEstado = 'ESTANCO';
                let shadowGlow = 'shadow-sm';
                let iconCamion = '';

                if (num === 2) {
                    // Modificación a Rojo Fuerte solicitado para la celda bloqueada
                    cardEstilos = 'bg-red-50 border-red-600 text-red-900 font-extrabold ring-2 ring-red-100';
                    badgeEstilos = 'bg-red-600 text-white font-bold';
                    textoEstado = 'BLOQUEADA';
                } else if (tipoBlock === 'b1' && num === camaraActiva) {
                    cardEstilos = 'bg-blue-50 border-blue-500 text-blue-900 ring-2 ring-blue-200';
                    badgeEstilos = 'bg-blue-500 text-white font-bold animate-pulse';
                    textoEstado = 'INGRESO';
                    shadowGlow = 'shadow-md';
                } else if (tipoBlock === 'b23' && num === camaraActiva) {
                    cardEstilos = 'bg-orange-50 border-orange-500 text-orange-900 ring-2 ring-orange-200';
                    badgeEstilos = 'bg-orange-500 text-white font-black animate-pulse';
                    textoEstado = 'INGRESO';
                    iconCamion = '<span class="text-xs block mt-0.5">🚚</span>';
                    shadowGlow = 'shadow-md';
                }

                contenedor.innerHTML += `
                    <div class="camara-node pos-${index} ${shadowGlow} w-[64px] h-[64px] border rounded-xl flex flex-col items-center justify-center p-1 text-center select-none ${cardEstilos}">
                        <span class="text-[10px] font-medium opacity-60 leading-none">CÁMARA</span>
                        <span class="text-lg font-black tracking-tight leading-none my-0.5">${num}</span>
                        <span class="text-[7px] font-black tracking-wider uppercase px-1 py-0.2 rounded-sm ${badgeEstilos}">${textoEstado}</span>
                        ${iconCamion}
                    </div>
                `;
            });
        }

        function avanzarPaso() {
            if (pasoActual < cronogramaPasos.length - 1) {
                pasoActual++;
            } else {
                pasoActual = 0; 
            }
            renderizarBloques();
        }

        function retrocederPaso() {
            if (pasoActual > 0) {
                pasoActual--;
                renderizarReloj ? renderizarReloj() : renderizarBloques();
            }
        }

        function reiniciarSimulacion() {
            pasoActual = 0;
            renderizarBloques();
        }

        renderizarBloques();
    </script>
</body>
</html>
